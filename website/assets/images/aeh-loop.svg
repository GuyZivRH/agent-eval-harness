<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="Agent Eval Harness evaluation loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0f131c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="220" rx="16" fill="url(#bg)"/>
  <text x="40" y="36" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Evaluate ’ judge ’ learn ’ improve</text>
  <text x="40" y="56" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">One eval.yaml across laptop, Harbor, and EvalHub</text>

  <!-- nodes -->
  <g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
    <rect x="40" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="95" y="120" fill="#f8fafc" font-weight="600">setup</text>
    <text x="95" y="140" fill="#94a3b8">deps · MLflow</text>

    <rect x="180" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="235" y="120" fill="#f8fafc" font-weight="600">analyze</text>
    <text x="235" y="140" fill="#94a3b8">eval.yaml</text>

    <rect x="320" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="375" y="120" fill="#f8fafc" font-weight="600">dataset</text>
    <text x="375" y="140" fill="#94a3b8">cases</text>

    <rect x="460" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="515" y="120" fill="#f8fafc" font-weight="600">run</text>
    <text x="515" y="140" fill="#fda4af">score</text>

    <rect x="600" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="655" y="120" fill="#f8fafc" font-weight="600">mlflow</text>
    <text x="655" y="140" fill="#94a3b8">traces</text>

    <rect x="740" y="90" width="110" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="795" y="120" fill="#f8fafc" font-weight="600">optimize</text>
    <text x="795" y="140" fill="#94a3b8">improve</text>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M150,125 H175"/>
    <path d="M290,125 H315"/>
    <path d="M430,125 H455"/>
    <path d="M570,125 H595"/>
    <path d="M710,125 H735"/>
  </g>
  <!-- feedback loop -->
  <path d="M795,160 C795,195 515,195 515,160" stroke="#f87171" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <text x="655" y="205" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">re-run after skill fixes</text>
</svg>
