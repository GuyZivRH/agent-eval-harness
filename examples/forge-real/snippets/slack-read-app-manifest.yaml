# Slack app manifest for slack-read-proxy's real read-scoped USER token.
#
# Per the design's "Identity binding" paragraph, this is deliberately a *separate* app from
# slack-send-app-manifest.yaml: Slack mints one user token per app, covering the union of
# whatever scopes that app was granted, so read and write on a single app would be one token
# that does both. This app requests only read scopes and has no bot user at all — it exists
# solely to mint a read-only xoxp- user token.
#
# Create at https://api.slack.com/apps/new -> "From a manifest" -> paste this file, then:
#   1. OAuth & Permissions -> Install to Workspace (the scopes below are pre-filled by the
#      manifest under "User Token Scopes").
#   2. The installing user must be a member of whatever channel(s) you want to read — a user
#      token can only see what that person can see.
#   3. Copy the "User OAuth Token" (xoxp-...) into SLACK_READ_USER_TOKEN in your .env.

display_information:
  name: Forge Slack Read Proxy
  description: Read-only Slack user-token source for rust-slack-proxy's slack-read-proxy (milestone 1)
  background_color: "#2c6b4f"

oauth_config:
  scopes:
    user:
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - users:read
      - users:read.email
      - search:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
