# AEH + OpenShell eval using curl-based agent with LiteLLM proxy
# Proves end-to-end flow: AEH orchestration → OpenShell sandbox → LiteLLM → Claude

skill: openshell-hello

execution:
  mode: case
  arguments: "{prompt}"
  timeout: 120
  env:
    OPENAI_BASE_URL: "http://host.openshell.internal:8000/v1"
    OPENAI_API_KEY: "test-key-12345"
    OPENAI_MODEL: "claude-sonnet-4-6"

runner:
  type: cli
  command: |
    bash -c 'mkdir -p /sandbox/output && \
    curl -s "${OPENAI_BASE_URL}/chat/completions" \
      -H "Authorization: Bearer ${OPENAI_API_KEY}" \
      -H "Content-Type: application/json" \
      -d "{\"model\":\"${OPENAI_MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"{args}\"}]}" \
    | tee /sandbox/output/raw.json \
    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[\"choices\"][0][\"message\"][\"content\"])" \
    | tee /sandbox/output/response.txt'

models:
  skill: claude-sonnet-4-6

dataset:
  path: cases
  schema: |
    prompt: The prompt to send to the model
    expected: Expected substring in response (optional)

outputs:
  - path: output
    schema: |
      raw.json: Full API response
      response.txt: Extracted response content

judges:
  - name: has-response
    check: |
      import os
      response_path = os.path.join(workspace, "output", "response.txt")
      result = os.path.exists(response_path) and os.path.getsize(response_path) > 0
